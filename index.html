<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>90-Day Countdown</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            padding: 2rem;
            max-width: 600px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: #38bdf8;
        }
        .subtitle {
            font-size: 1rem;
            color: #94a3b8;
            margin-bottom: 2.5rem;
        }
        .timer {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .time-box {
            background-color: #1e293b;
            padding: 1.5rem;
            border-radius: 12px;
            min-width: 100px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid #334155;
        }
        .number {
            font-size: 3rem;
            font-weight: 700;
            display: block;
            color: #ffffff;
        }
        .label {
            font-size: 0.875rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 0.25rem;
        }
        .expired {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ef4444;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Agentic adoption countdown</h1>
        <div class="subtitle">90 days since July 9</div>
        
        <div class="timer" id="countdown">
            <div class="time-box">
                <span class="number" id="days">00</span>
                <span class="label">Days</span>
            </div>
            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">Hours</span>
            </div>
            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">Mins</span>
            </div>
            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">Secs</span>
            </div>
        </div>
    </div>

    <script>
        // Define start date (July 9, 2026)
        const startDate = new Date("July 9, 2026 00:00:00").getTime();
        
        // Add 90 days in milliseconds (90 days * 24 hours * 60 mins * 60 secs * 1000 ms)
        const ninetyDaysInMs = 90 * 24 * 60 * 60 * 1000;
        const targetDate = startDate + ninetyDaysInMs;

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            // If the countdown is finished
            if (difference < 0) {
                clearInterval(timerInterval);
                document.getElementById("countdown").innerHTML = "<div class='expired'>Time's up!</div>";
                return;
            }

            // Time calculations for days, hours, minutes, and seconds
            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            // Output the result in the respective elements with padding
            document.getElementById("days").innerText = days.toString().padStart(2, '0');
            document.getElementById("hours").innerText = hours.toString().padStart(2, '0');
            document.getElementById("minutes").innerText = minutes.toString().padStart(2, '0');
            document.getElementById("seconds").innerText = seconds.toString().padStart(2, '0');
        }

        // Run the function immediately and then every second
        updateCountdown();
        const timerInterval = setInterval(updateCountdown, 1000);
    </script>

</body>
</html>
